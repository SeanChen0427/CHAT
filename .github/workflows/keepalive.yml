# Sean 版（Supabase）：免費方案連續 7 天沒有活動會暫停專案，每天打一次健康檢查保持運作。
# （資料庫內的每分鐘排程本身也會持續呼叫後端，這裡是第二道保險，順便及早發現異常。）
name: 保持運作

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: 健康檢查
        env:
          REF: ${{ secrets.SUPABASE_PROJECT_REF || vars.SUPABASE_PROJECT_REF }}
          API_BASE: ${{ vars.API_BASE }}
        run: |
          if [ -z "$API_BASE" ]; then
            if [ -n "$REF" ]; then API_BASE="https://${REF}.supabase.co/functions/v1";
            elif [ "${GITHUB_REPOSITORY_OWNER,,}" = "seanchen0427" ]; then API_BASE="https://gynpbquftdsoevxiwivp.supabase.co/functions/v1";
            else echo "未設定 Supabase，略過。"; exit 0; fi
          fi
          curl -fsS --retry 3 --retry-delay 20 "$API_BASE/api/health"
