# Sean 版（Supabase）：main 有變更時把後端部署到 Supabase Edge Function「api」。
# 需要 repo Secrets 的 SUPABASE_ACCESS_TOKEN（Supabase 後台 > Account > Access Tokens 產生）；
# 沒設定時略過（也可以請 Claude 用 Supabase 連接器部署）。
name: 部署後端

on:
  push:
    branches: [main]
    paths: ['supabase/functions/**']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'gynpbquftdsoevxiwivp' }}
    steps:
      - uses: actions/checkout@v4
      - name: 未設定權杖時略過
        if: env.SUPABASE_ACCESS_TOKEN == ''
        run: echo "未設定 SUPABASE_ACCESS_TOKEN，略過部署。"
      - uses: supabase/setup-cli@v1
        if: env.SUPABASE_ACCESS_TOKEN != ''
        with:
          version: latest
      - name: 部署
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: supabase functions deploy api --project-ref "$PROJECT_REF" --no-verify-jwt --use-api
