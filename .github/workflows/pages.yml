# Sean 版：建置後台前端並推到 gh-pages 分支，由 GitHub Pages「Deploy from a branch（gh-pages）」發佈。
# 網址：https://<帳號>.github.io/<repo 名稱>/
name: 發佈後台網頁

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ['安裝與更新']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 決定後端網址
        env:
          REF: ${{ secrets.SUPABASE_PROJECT_REF || vars.SUPABASE_PROJECT_REF }}
          API_BASE: ${{ vars.API_BASE }}
        run: |
          if [ -z "$API_BASE" ]; then
            if [ -n "$REF" ]; then API_BASE="https://${REF}.supabase.co/functions/v1";
            elif [ "${GITHUB_REPOSITORY_OWNER,,}" = "seanchen0427" ]; then API_BASE="https://gynpbquftdsoevxiwivp.supabase.co/functions/v1";
            else echo "::error::還沒設定 SUPABASE_PROJECT_REF，請照學員安裝手冊第 4 步設定。"; exit 1; fi
          fi
          echo "VITE_API_BASE=$API_BASE" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm ci
        working-directory: admin
      - name: 建置
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          PRIVACY_CONTACT: ${{ vars.PRIVACY_CONTACT }}
        run: npm run build:admin && touch admin/dist/.nojekyll
      - name: 推到 gh-pages 分支
        run: |
          cd admin/dist
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -qm "後台網頁（${GITHUB_SHA::7}）"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" gh-pages
