# Sean 版（Supabase）：把後台前端建置後發佈到 GitHub Pages（https://<帳號>.github.io/CHAT/）。
name: 發佈後台網頁

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci
        working-directory: admin
      - name: 建置
        env:
          # 後端 API 網址；換 Supabase 專案時改 repo 的 Variables > API_BASE。
          VITE_API_BASE: ${{ vars.API_BASE || 'https://gynpbquftdsoevxiwivp.supabase.co/functions/v1' }}
          VITE_BASE: /${{ github.event.repository.name }}/
          PRIVACY_CONTACT: ${{ vars.PRIVACY_CONTACT }}
        run: npm run build:admin
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: admin/dist
      - id: deployment
        uses: actions/deploy-pages@v4
