# Sean 版（Supabase）：建置後台前端並推到 gh-pages 分支，由 GitHub Pages「Deploy from a branch（gh-pages）」發佈。
# 網址：https://<帳號>.github.io/CHAT/
name: 發佈後台網頁

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci
        working-directory: admin
      - name: 建置
        env:
          # 後端 API 網址；換 Supabase 專案時改 repo 的 Variables > API_BASE。
          VITE_API_BASE: ${{ vars.API_BASE || 'https://gynpbquftdsoevxiwivp.supabase.co/functions/v1' }}
          VITE_BASE: /${{ github.event.repository.name }}/
          PRIVACY_CONTACT: ${{ vars.PRIVACY_CONTACT }}
        run: npm run build:admin && touch admin/dist/.nojekyll
      - name: 推到 gh-pages 分支
        run: |
          cd admin/dist
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -qm "後台網頁（${GITHUB_SHA::7}）"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" gh-pages
